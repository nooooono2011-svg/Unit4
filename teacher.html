<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Unit 4 Teacher Board</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#222;--accent:#5b8def;--ok:#2f9e44;--bad:#d9485f;--line:#e8eaf1}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Comic Sans MS",Arial,sans-serif;background:linear-gradient(135deg,#f6f7fb,#fff8f1);color:var(--ink)}
header{padding:18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
h1{margin:0;font-size:28px}.sub{color:#666;margin-top:6px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.06);margin:20px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,button,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #dfe3ee;font-size:16px}
button{border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#eef2ff;color:#334}
button.danger{background:#eef2ff;color:#a33}
.hidden{display:none!important}
.msg{margin-top:10px;font-weight:700}.good{color:var(--ok)}.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f8f9fd;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}.stat b{font-size:26px;display:block}
.toolbar{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;align-items:center}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left}th{background:#f7f8fc;position:sticky;top:0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff}
.small{font-size:13px;color:#666}
@media(max-width:700px){.grid,.stats,.toolbar{grid-template-columns:1fr}h1{font-size:23px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>🔒 Unit 4 Teacher Board</h1><div class="sub">Student results • The World of TV</div></div></header>
<main class="wrap">

<div id="authCard" class="card">
  <h2>Teacher Login</h2>
  <p class="small">The first teacher account created on this page becomes the only account allowed to view student results.</p>
  <div class="grid">
    <input id="email" type="email" placeholder="Teacher email">
    <input id="password" type="password" placeholder="Password (6+ characters)">
  </div>
  <div class="grid" style="margin-top:12px">
    <button id="loginBtn">Log in</button>
    <button id="signupBtn" class="secondary">Create teacher account</button>
  </div>
  <div id="authMsg" class="msg"></div>
</div>

<div id="board" class="hidden">
  <div class="card">
    <div style="display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap">
      <div><h2 style="margin:0">Welcome, Teacher Hakimah 👩‍🏫</h2><div id="who" class="small"></div></div>
      <button id="logoutBtn" class="danger" style="width:auto">Log out</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="countStat">0</b><span>Submissions</span></div>
    <div class="stat"><b id="avgStat">0%</b><span>Average</span></div>
    <div class="stat"><b id="todayStat">0</b><span>Today</span></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <input id="searchBox" type="text" placeholder="Search student or class">
      <select id="classFilter"><option value="">All classes</option></select>
      <button id="refreshBtn" style="width:auto">Refresh</button>
    </div>
  </div>

  <div class="card">
    <div class="tableWrap">
      <table>
        <thead><tr><th>Student</th><th>Class</th><th>Score</th><th>%</th><th>Attempts</th><th>Completed</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="small hidden">No results yet.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://qsywfgrwplqzlrrhdigt.supabase.co';
const SUPABASE_KEY='sb_publishable_woKeBzsGYNHMcCgj8v2GQw_TJ8C-ptN';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const authCard=document.getElementById('authCard');
const board=document.getElementById('board');
const authMsg=document.getElementById('authMsg');
let allRows=[];

function setMsg(text,ok=false){authMsg.textContent=text;authMsg.className='msg '+(ok?'good':'bad')}
function credentials(){return {email:document.getElementById('email').value.trim(),password:document.getElementById('password').value}}

async function claimTeacher(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user) throw new Error('No signed-in user.');
  const {error}=await sb.from('teacher_profiles').insert({user_id:user.id,singleton:true});
  if(error){
    if(error.code==='23505') throw new Error('A teacher account is already registered. Please log in with that account.');
    throw error;
  }
}

async function signup(){
  try{
    setMsg('Creating account...');
    const {email,password}=credentials();
    if(!email||password.length<6) throw new Error('Enter a valid email and password with at least 6 characters.');
    const {data,error}=await sb.auth.signUp({email,password});
    if(error) throw error;
    if(!data.session){
      setMsg('Check your email and confirm the account, then return here and log in.',true);
      return;
    }
    await claimTeacher();
    await showBoard();
  }catch(e){setMsg(e.message||'Could not create account.')}
}

async function login(){
  try{
    setMsg('Logging in...');
    const {email,password}=credentials();
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    const {data:profile,error:pe}=await sb.from('teacher_profiles').select('user_id').maybeSingle();
    if(pe) throw pe;
    if(!profile){
      try{await claimTeacher()}catch(e){await sb.auth.signOut();throw e}
    }
    await showBoard();
  }catch(e){setMsg(e.message||'Could not log in.')}
}

async function showBoard(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){authCard.classList.remove('hidden');board.classList.add('hidden');return}
  const {data:profile,error}=await sb.from('teacher_profiles').select('user_id').maybeSingle();
  if(error||!profile){await sb.auth.signOut();setMsg('This account is not authorized to view results.');return}
  document.getElementById('who').textContent=user.email||'Teacher';
  authCard.classList.add('hidden');
  board.classList.remove('hidden');
  await loadResults();
}

async function loadResults(){
  const {data,error}=await sb.from('student_results').select('*').order('completed_at',{ascending:false});
  if(error){alert('Could not load results.');return}
  allRows=data||[];
  buildClassFilter();
  renderRows();
  updateStats();
}

function buildClassFilter(){
  const sel=document.getElementById('classFilter');
  const current=sel.value;
  const classes=[...new Set(allRows.map(r=>r.class_name).filter(Boolean))].sort();
  sel.innerHTML='<option value="">All classes</option>'+classes.map(c=>`<option>${escapeHtml(c)}</option>`).join('');
  sel.value=classes.includes(current)?current:'';
}

function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function filtered(){
  const q=document.getElementById('searchBox').value.trim().toLowerCase();
  const cls=document.getElementById('classFilter').value;
  return allRows.filter(r=>{
    const hit=!q||String(r.student_name||'').toLowerCase().includes(q)||String(r.class_name||'').toLowerCase().includes(q);
    const classOk=!cls||r.class_name===cls;
    return hit&&classOk;
  });
}

function renderRows(){
  const data=filtered();
  document.getElementById('rows').innerHTML=data.map(r=>`<tr>
    <td>${escapeHtml(r.student_name)}</td>
    <td><span class="pill">${escapeHtml(r.class_name)}</span></td>
    <td>${r.score} / ${r.total}</td>
    <td>${Number(r.percentage||0).toFixed(0)}%</td>
    <td>${r.attempts}</td>
    <td>${new Date(r.completed_at).toLocaleString()}</td>
  </tr>`).join('');
  document.getElementById('empty').classList.toggle('hidden',data.length>0);
}

function updateStats(){
  document.getElementById('countStat').textContent=allRows.length;
  const avg=allRows.length?Math.round(allRows.reduce((a,r)=>a+Number(r.percentage||0),0)/allRows.length):0;
  document.getElementById('avgStat').textContent=avg+'%';
  const now=new Date(); const today=allRows.filter(r=>{const d=new Date(r.completed_at);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate()}).length;
  document.getElementById('todayStat').textContent=today;
}

document.getElementById('signupBtn').onclick=signup;
document.getElementById('loginBtn').onclick=login;
document.getElementById('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
document.getElementById('refreshBtn').onclick=loadResults;
document.getElementById('searchBox').addEventListener('input',renderRows);
document.getElementById('classFilter').addEventListener('change',renderRows);

(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)await showBoard()})();
</script>
</main>
</body>
</html>
